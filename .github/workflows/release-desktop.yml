name: Publicar app desktop

# A cada merge na main, gera o instalador do Windows e publica uma Release no
# GitHub. Os apps instalados procuram essas Releases (update.electronjs.org) e
# se atualizam sozinhos.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Definir versão
        id: version
        shell: bash
        run: |
          # Versão = major.minor do package.json + número da execução a partir
          # de RUN_OFFSET. A 1.0 começou na execução 13 (a 12 publicou a v0.2.12).
          # Ao subir major/minor no package.json, atualize RUN_OFFSET para o
          # número da próxima execução, para o patch voltar a 0.
          RUN_OFFSET=13
          BASE=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          PATCH=$(( ${{ github.run_number }} - RUN_OFFSET ))
          if [ "$PATCH" -lt 0 ]; then PATCH=0; fi
          VERSION="$BASE.$PATCH"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Gerar instalador
        run: npm run make

      - name: Publicar Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES=$(git log -1 --pretty=%B)
          gh release create "v$VERSION" out/make/squirrel.windows/x64/* \
            --title "Corretor de Simulados $VERSION" \
            --notes "$NOTES" \
            --target "${{ github.sha }}"
